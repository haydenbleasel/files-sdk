name: Validate
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - changeset-release/main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        runtime: [node-20, node-22, node-24, bun]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 20.x
        if: matrix.runtime == 'node-20'
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Use Node.js 22.x
        if: matrix.runtime == 'node-22'
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Use Node.js 24.x
        if: matrix.runtime == 'node-24'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - uses: oven-sh/setup-bun@v2
        name: Install Bun

      - name: Install dependencies
        run: bun install

      - name: Build SDK
        run: bun run build --filter files-sdk

      # Tests run under Bun in every leg, so this is the one place the matrix
      # Node version actually executes the built package.
      - name: Smoke-test the build under Node
        if: matrix.runtime != 'bun'
        run: |
          node --input-type=module -e "
            const { Files } = await import('./packages/files-sdk/dist/index.js');
            const { memory } = await import('./packages/files-sdk/dist/memory/index.js');
            const files = new Files({ adapter: memory() });
            await files.upload('smoke.txt', 'ok');
            const body = await (await files.download('smoke.txt')).text();
            if (body !== 'ok') throw new Error('memory round-trip failed');
          "
          node packages/files-sdk/dist/cli/index.js --help > /dev/null

  test:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        runtime: [node-20, node-22, node-24, bun]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 20.x
        if: matrix.runtime == 'node-20'
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Use Node.js 22.x
        if: matrix.runtime == 'node-22'
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Use Node.js 24.x
        if: matrix.runtime == 'node-24'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - uses: oven-sh/setup-bun@v2
        name: Install Bun

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - uses: oven-sh/setup-bun@v2
        name: Install Bun

      - name: Install dependencies
        run: bun install

      - name: Build SDK
        run: bun run build --filter files-sdk

      - name: Check linting and formatting
        run: bun run check

  types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        name: Install Bun

      - name: Install dependencies
        run: bun install

      - name: Check types
        run: bun run types

  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        name: Install Bun

      - name: Install dependencies
        run: bun install

      - name: Build web
        run: bun run build --filter web
