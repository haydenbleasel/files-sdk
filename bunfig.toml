[install]
# Hoisted (flat) node_modules instead of bun's default isolated `.bun` store.
# Originally adopted for the old Next.js/Turbopack docs site, which couldn't
# follow the isolated store's symlinks to nested deps. The site is Blume/Astro
# now; the flat layout stays because it matches a typical npm/CI install and the
# workspace is set up around it (e.g. apps/web declares the js-yaml and cookie
# packages Astro externalizes so they resolve when hoisted). Switching linkers
# needs a fresh `bun install` and a full build/test pass.
linker = "hoisted"
